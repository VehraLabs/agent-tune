[project]
name = "agent-tune"
version = "0.1.0"
description = "Read car data through your KTuner dongle, analyze it, and write a new .kcl tune file to review and flash in KTuner. Built for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vehra" }]
keywords = ["ktuner", "honda", "tuning", "ecu", "datalog", "mcp", "ai-agent", "skill"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
agent-tune = "agent_tune.cli:main"

[project.urls]
Homepage = "https://github.com/VehraLabs/agent-tune"
Repository = "https://github.com/VehraLabs/agent-tune"
Issues = "https://github.com/VehraLabs/agent-tune/issues"
Changelog = "https://github.com/VehraLabs/agent-tune/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tune"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
