name: Bug
description: Something gave wrong output, crashed, or behaved differently from the docs.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command or tool call and its output
      render: shell
  - type: input
    id: version
    attributes:
      label: agent-tune version (`agent-tune --version`) and OS
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car, ECU part number and KTuner version (if relevant)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no tune files, logs, VINs or serial numbers.
          required: true
