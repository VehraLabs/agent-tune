name: pr-title
# PRs are squash merged and the PR title becomes the commit on main, so it must follow
# Conventional Commits: type(optional scope)!: description
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'feat: add X' or 'fix(tune): handle Y'."
            echo "Allowed types: feat fix docs style refactor perf test build ci chore revert."
            echo "Got: $TITLE"
            exit 1
          fi
